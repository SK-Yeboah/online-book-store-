services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: bookstore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root@123}
      MYSQL_DATABASE: ${DB_NAME:-online_book_store}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root@123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bookstore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Application ────────────────────────────────────────────────────────────
  # Comment out the 'app' service if you prefer to run the app directly with
  # 'mvn spring-boot:run' and only use docker-compose for MySQL + Redis.
  # Schema: Flyway runs on startup (dev profile). See docs/docker-schema.md.
  app:
    build: .
    container_name: bookstore-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-online_book_store}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root@123}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-http://localhost:3000/payment/callback}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-GHS}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret}
      SECURITY_RATE_LIMIT_CAPACITY: ${SECURITY_RATE_LIMIT_CAPACITY:-60}
      SECURITY_RATE_LIMIT_REFILL_PER_MINUTE: ${SECURITY_RATE_LIMIT_REFILL_PER_MINUTE:-60}
      ACTUATOR_PROMETHEUS_PUBLIC: ${ACTUATOR_PROMETHEUS_PUBLIC:-true}
      SECURITY_SWAGGER_PUBLIC: ${SECURITY_SWAGGER_PUBLIC:-true}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── Prometheus ─────────────────────────────────────────────────────────────
  # Scrapes Spring Actuator metrics at /actuator/prometheus
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bookstore-prometheus
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  # ── Grafana ────────────────────────────────────────────────────────────────
  # Pre-provisioned Prometheus datasource + Bookstore Overview dashboard
  grafana:
    image: grafana/grafana:11.3.1
    container_name: bookstore-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/bookstore.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
