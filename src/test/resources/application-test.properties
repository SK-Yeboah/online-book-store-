# ── Test profile ─────────────────────────────────────────────────────────────
# Used automatically when tests run with @ActiveProfiles("test")

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookstore_test}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Let Hibernate create/drop the schema for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway — Hibernate manages the test schema
spring.flyway.enabled=false

# JWT — test-only secret (not sensitive)
jwt.secret=74657374736563726574746573747365637265747465737473656372657474657374

# Actuator — Redis is not required in test profile (Caffeine blacklist)
management.endpoints.web.exposure.include=health,prometheus
management.health.redis.enabled=false

# CORS — allow test origins
cors.allowed-origins=http://localhost:3000

# Disable rate limiting for integration tests (RateLimitFilterTest enables it explicitly)
security.rate-limiting.enabled=false

payment.provider=mock
payment.currency=GHS
payment.webhook-secret=test_webhook_secret
payment.callback-url=http://localhost:3000/payment/callback
payment.intent-ttl-minutes=45
payment.expiration-enabled=false
payment.expiration-batch-size=50
payment.expiration-fixed-delay-ms=300000
