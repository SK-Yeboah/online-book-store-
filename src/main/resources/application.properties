# Load .env from project root (optional — only present in local dev)
spring.config.import=optional:file:.env[.properties]

spring.application.name=online-book-store
server.port=${SERVER_PORT:8080}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
# Allows Flyway to manage a DB that already has tables created outside of Flyway.
# On a fresh DB this has no effect — all migrations run normally from V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── DataSource ────────────────────────────────────────────────────────────────
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ── Account lockout ───────────────────────────────────────────────────────────
security.lockout.max-attempts=${SECURITY_LOCKOUT_MAX_ATTEMPTS:5}
security.lockout.duration-minutes=${SECURITY_LOCKOUT_DURATION_MINUTES:15}
security.lockout.reset-after-hours=${SECURITY_LOCKOUT_RESET_AFTER_HOURS:24}

# ── Rate limiting ─────────────────────────────────────────────────────────────
security.rate-limit.capacity=${SECURITY_RATE_LIMIT_CAPACITY:60}
security.rate-limit.refill-per-minute=${SECURITY_RATE_LIMIT_REFILL_PER_MINUTE:60}

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
