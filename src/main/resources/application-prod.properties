# ── Production profile ────────────────────────────────────────────────────────
# Activated with: SPRING_PROFILES_ACTIVE=prod
#
# ALL values must be injected as environment variables by the cloud platform.
# No fallback defaults for secrets — the app will refuse to start if any are missing.

# DataSource — must come from cloud secrets manager / env injection
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=true&requireSSL=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP connection pool tuning for production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT — must come from cloud secrets manager
jwt.secret=${JWT_SECRET}

# Hibernate — validate only; Flyway owns all schema changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway enabled in production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Actuator — restrict to health and prometheus only (do not expose env/beans)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# CORS — set to your actual frontend domain(s) via env var
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
