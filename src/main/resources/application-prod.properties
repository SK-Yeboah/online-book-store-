# ── Production profile ────────────────────────────────────────────────────────
# Activated with: SPRING_PROFILES_ACTIVE=prod
#
# ALL secrets must be injected by the cloud platform (Secrets Manager / ECS task env).
# No fallback defaults for secrets — the app will refuse to start if any are missing.
# See docs/production-checklist.md before enabling public traffic.

# DataSource — must come from cloud secrets manager / env injection
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=true&requireSSL=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP connection pool tuning for production
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT — must come from cloud secrets manager
jwt.secret=${JWT_SECRET}

# Hibernate — validate only; Flyway owns all schema changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway enabled in production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Actuator — health for ALB; prometheus locked to ADMIN (private scrape + token)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
security.actuator.prometheus-public=false
security.swagger-public=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# CORS — set to your actual frontend domain(s) via env var
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Rate limiting — sane production defaults (raise only behind known capacity tests)
security.rate-limiting.capacity=${SECURITY_RATE_LIMIT_CAPACITY:60}
security.rate-limiting.refill-per-minute=${SECURITY_RATE_LIMIT_REFILL_PER_MINUTE:60}

# Payments — inject secrets from the cloud platform
payment.provider=${PAYMENT_PROVIDER:paystack}
payment.currency=${PAYMENT_CURRENCY:GHS}
payment.callback-url=${PAYMENT_CALLBACK_URL}
payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET}
payment.intent-ttl-minutes=${PAYMENT_INTENT_TTL_MINUTES:45}
payment.expiration-enabled=${PAYMENT_EXPIRATION_ENABLED:true}
payment.expiration-batch-size=${PAYMENT_EXPIRATION_BATCH_SIZE:50}
payment.expiration-fixed-delay-ms=${PAYMENT_EXPIRATION_FIXED_DELAY_MS:300000}
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.public-key=${PAYSTACK_PUBLIC_KEY}
