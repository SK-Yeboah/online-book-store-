# ── Dev profile ──────────────────────────────────────────────────────────────
# Activated with: SPRING_PROFILES_ACTIVE=dev  (or default when running locally)
#
# Secrets come from .env in the project root. Generate a JWT secret with:
#   openssl rand -hex 32

# DataSource (dev defaults — override in .env)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:online_book_store}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JWT (must be set in .env — no hardcoded fallback)
jwt.secret=${JWT_SECRET}

# Hibernate — allow schema changes locally, verbose SQL for debugging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway disabled in dev — let Hibernate manage the schema (faster iteration)
spring.flyway.enabled=false

# Actuator — expose all endpoints locally
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# CORS — local front-end dev servers
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200


# Payments
payment.provider=paystack
payment.currency=GHS
payment.callback-url=${PAYMENT_CALLBACK_URL:http://localhost:3000/payment/callback}

paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.public-key=${PAYSTACK_PUBLIC_KEY}