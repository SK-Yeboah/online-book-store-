# ── Dev profile ──────────────────────────────────────────────────────────────
# Activated with: SPRING_PROFILES_ACTIVE=dev  (or default when running locally)
#
# Secrets come from .env in the project root. Generate a JWT secret with:
#   openssl rand -hex 32

# DataSource (dev defaults — override in .env)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:online_book_store}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JWT (must be set in .env — no hardcoded fallback)
jwt.secret=${JWT_SECRET}

# Hibernate — Flyway owns schema (MySQL ENUMs are not updated reliably by ddl-auto=update)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway enabled in dev/Docker so migrations (e.g. PENDING_PAYMENT) always apply
spring.flyway.enabled=true

# Actuator — expose all endpoints locally
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# CORS — local front-end dev servers
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200

# Payments
payment.provider=${PAYMENT_PROVIDER:paystack}
payment.currency=${PAYMENT_CURRENCY:GHS}
payment.callback-url=${PAYMENT_CALLBACK_URL:http://localhost:3000/payment/callback}
payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret}
payment.intent-ttl-minutes=45
payment.expiration-enabled=true
payment.expiration-batch-size=50
payment.expiration-fixed-delay-ms=300000

paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.public-key=${PAYSTACK_PUBLIC_KEY}